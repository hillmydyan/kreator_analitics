[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowkreator"
version = "0.1.0"
description = "TikTok Creator Product Analytics Scraper (Desktop + Android ADB)"
readme = "PRD_TikTok_Creator_Product_Analytics_Scraper.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
