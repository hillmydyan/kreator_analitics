name: Build Windows Desktop App (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (64-bit)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials SQLAlchemy openpyxl pyinstaller pytest

      - name: Run unit and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Download Android Platform-Tools (adb.exe) for Windows
        shell: pwsh
        run: |
          if (Test-Path "bin/platform-tools") { Remove-Item -Recurse -Force "bin/platform-tools" }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools-win.zip"
          Expand-Archive -Path "platform-tools-win.zip" -DestinationPath "bin" -Force
          Remove-Item -Force "platform-tools-win.zip"

      - name: Build Windows Executable with PyInstaller
        run: python build_windows.py

      - name: Verify Windows .exe and bundled adb.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/TikTokCreatorAnalytics/TikTokCreatorAnalytics.exe")) {
            Write-Error "TikTokCreatorAnalytics.exe was not generated!"
            exit 1
          }
          if (-not (Test-Path "dist/TikTokCreatorAnalytics/bin/platform-tools/adb.exe")) {
            Write-Error "Bundled adb.exe was not found!"
            exit 1
          }
          Write-Host "Verified TikTokCreatorAnalytics.exe and bundled adb.exe successfully!"

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokCreatorAnalytics-Windows-x64
          path: dist/TikTokCreatorAnalytics/
